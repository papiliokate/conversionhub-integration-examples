<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConversionHub Gamified Captcha Alternative Example</title>
</head>
<body>

    <h1>Sign Up</h1>
    <p>We use a frictionless gamified captcha alternative to protect our forms and increase conversion.</p>

    <form id="signup-form" action="/submit" method="POST">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!-- The ConversionHub Widget Container -->
        <div style="width: 100%; max-width: 400px; height: 400px;">
            <iframe src="https://conversion.business/sunny-day-maze/?mode=captcha&clientId=ch_pub_demo_testkey_12345" style="width:100%; height:100%; border:none; border-radius:12px;"></iframe>
        </div>
        <br>

        <button type="submit" id="submit-btn" disabled>Submit Securely</button>
    </form>

    <script>
        // Listen for the verification success event from the iframe
        window.addEventListener('message', async (event) => {
            if (event.data && event.data.type === 'oops_captcha_solved') {
                const { payload, signature } = event.data;
                console.log('User verified. Payload:', payload, 'Signature:', signature);
                
                // Append the data to the form for backend validation
                const hiddenPayload = document.createElement('input');
                hiddenPayload.type = 'hidden';
                hiddenPayload.name = 'ch-payload';
                hiddenPayload.value = payload;
                document.getElementById('signup-form').appendChild(hiddenPayload);
                
                const hiddenSignature = document.createElement('input');
                hiddenSignature.type = 'hidden';
                hiddenSignature.name = 'ch-signature';
                hiddenSignature.value = signature;
                document.getElementById('signup-form').appendChild(hiddenSignature);
                
                // Enable the submit button
                document.getElementById('submit-btn').disabled = false;
            }
        });
    </script>

</body>
</html>
